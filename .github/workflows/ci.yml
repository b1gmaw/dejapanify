name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint the extension package
        run: npm run build && npm run lint:ext

      - name: Build both targets
        run: npm run build

      - name: Verify build output
        run: |
          for target in chrome firefox; do
            for file in manifest.json content.js popup/popup.html options/options.html icons/icon128.png; do
              test -f "dist/$target/$file" || { echo "missing dist/$target/$file"; exit 1; }
            done
          done
          echo "both targets complete"

      - uses: actions/upload-artifact@v4
        with:
          name: dejapanify-dist
          path: dist/

  e2e:
    name: Real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Confirm Firefox is available
        run: firefox --version

      # Installs the built extension into a real headless Firefox and has the
      # demo page report its own conversion results back. This is the check
      # that catches an extension which builds and unit-tests cleanly but
      # converts nothing in an actual browser.
      #
      # --http-only on purpose: browsers refuse to inject content scripts into
      # file:// pages, so that case is informational and would sit permanently
      # red in CI.
      - name: End-to-end conversion check
        run: npm run e2e -- --http-only
        timeout-minutes: 5
