<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dejapanify</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>dejapanify</h1>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <p class="host" id="host">—</p>

  <div class="stats">
    <div class="stat"><span class="num" id="detected">0</span><span class="cap">detected</span></div>
    <div class="stat"><span class="num" id="converted">0</span><span class="cap">converted</span></div>
  </div>

  <p class="status" id="status"></p>

  <div class="row">
    <label class="check">
      <input type="checkbox" id="site-blocked">
      <span>Disable on this site</span>
    </label>
  </div>

  <div class="actions">
    <button type="button" id="convert-now">Convert this page now</button>
    <button type="button" id="options" class="ghost">Settings</button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
